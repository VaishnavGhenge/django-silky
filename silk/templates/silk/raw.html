{% load silk_assets %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Silky - body</title>
    <script>try { var t = localStorage.getItem('silky-theme'); if (t && t !== 'system') document.documentElement.dataset.theme = t; } catch (e) {}</script>
    <link rel="stylesheet" href="{% silk_asset 'silk/css/silky.css' %}"/>
    <link rel="stylesheet" href="{% silk_asset 'silk/lib/highlight/silk-theme.css' %}"/>
    <script src="{% silk_asset 'silk/lib/highlight/highlight.pack.js' %}" defer></script>
    <script src="{% silk_asset 'silk/js/pages/request.js' %}" defer></script>
</head>
<body class="rawpage">
<pre class="code code--block"><code>{{ body }}</code></pre>
</body>
</html>
