{% with url_name=request.resolver_match.url_name %}
<nav class="subtabs" aria-label="Request">
    <a class="subtab subtab--back" href="{% url 'silk:requests' %}" title="Back to requests" aria-label="Back to requests"><svg class="silk-icon silk-icon--sm" aria-hidden="true"><use href="#i-chevron-left"></use></svg></a>
    <a class="subtab" href="{% url 'silk:request_detail' silk_request.id %}"{% if url_name == 'request_detail' %} aria-current="page"{% endif %}>Overview</a>
    <a class="subtab" href="{% url 'silk:request_sql' silk_request.id %}"{% if url_name == 'request_sql' or url_name == 'request_sql_detail' %} aria-current="page"{% endif %}>SQL <span class="count">{{ silk_request.num_sql_queries }}</span></a>
    <a class="subtab" href="{% url 'silk:request_profiling' silk_request.id %}"{% if url_name == 'request_profiling' or url_name == 'request_profile_detail' or url_name == 'request_and_profile_sql' or url_name == 'request_and_profile_sql_detail' %} aria-current="page"{% endif %}>Profiling</a>
    <a class="subtab" href="{% url 'silk:cprofile' silk_request.id %}"{% if url_name == 'cprofile' %} aria-current="page"{% endif %}>cProfile</a>
</nav>
{% endwith %}
